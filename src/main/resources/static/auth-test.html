<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Flow Test - School Health Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-3xl font-bold text-center mb-8">Authentication Flow Test</h1>
            
            <!-- System Status -->
            <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                <h2 class="text-xl font-semibold mb-4">System Status</h2>
                <div id="systemStatus" class="space-y-2">
                    <p class="text-gray-600">Loading...</p>
                </div>
                <button onclick="checkSystemStatus()" class="mt-4 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                    Refresh Status
                </button>
            </div>

            <!-- Database Roles -->
            <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                <h2 class="text-xl font-semibold mb-4">Database Roles</h2>
                <div id="databaseRoles" class="space-y-2">
                    <p class="text-gray-600">Loading...</p>
                </div>
                <button onclick="checkDatabaseRoles()" class="mt-4 bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                    Check Roles
                </button>
            </div>

            <!-- Registration Test -->
            <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                <h2 class="text-xl font-semibold mb-4">Registration Test</h2>
                <form id="registrationForm" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-2">Username</label>
                            <input type="text" id="regUsername" class="w-full border rounded px-3 py-2" placeholder="testuser" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Email</label>
                            <input type="email" id="regEmail" class="w-full border rounded px-3 py-2" placeholder="test@example.com" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Full Name</label>
                            <input type="text" id="regFullName" class="w-full border rounded px-3 py-2" placeholder="Test User" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Phone</label>
                            <input type="text" id="regPhone" class="w-full border rounded px-3 py-2" placeholder="123-456-7890">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Password</label>
                            <input type="password" id="regPassword" class="w-full border rounded px-3 py-2" placeholder="Password123" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Role</label>
                            <select id="regRole" class="w-full border rounded px-3 py-2">
                                <option value="Student">Student</option>
                                <option value="Parent">Parent</option>
                                <option value="SchoolNurse">School Nurse</option>
                                <option value="Admin">Admin</option>
                                <option value="Manager">Manager</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600">
                        Test Registration
                    </button>
                </form>
                <div id="registrationResult" class="mt-4"></div>
            </div>

            <!-- Login Test -->
            <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                <h2 class="text-xl font-semibold mb-4">Login Test</h2>
                <form id="loginForm" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-2">Username</label>
                            <input type="text" id="loginUsername" class="w-full border rounded px-3 py-2" placeholder="testuser" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Password</label>
                            <input type="password" id="loginPassword" class="w-full border rounded px-3 py-2" placeholder="Password123" required>
                        </div>
                    </div>
                    <button type="submit" class="bg-green-500 text-white px-6 py-2 rounded hover:bg-green-600">
                        Test Login
                    </button>
                </form>
                <div id="loginResult" class="mt-4"></div>
            </div>

            <!-- Authentication Status -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-semibold mb-4">Current Authentication Status</h2>
                <div id="authStatus" class="space-y-2">
                    <p class="text-gray-600">Not authenticated</p>
                </div>
                <div class="mt-4 space-x-4">
                    <button onclick="checkAuthStatus()" class="bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600">
                        Check Status
                    </button>
                    <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Utility function to display results
        function displayResult(elementId, data, isError = false) {
            const element = document.getElementById(elementId);
            const className = isError ? 'bg-red-100 text-red-700 p-4 rounded' : 'bg-green-100 text-green-700 p-4 rounded';
            element.innerHTML = `<div class="${className}"><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
        }

        // Check system status
        async function checkSystemStatus() {
            try {
                const response = await fetch('/api/test/health');
                const data = await response.json();
                displayResult('systemStatus', data);
            } catch (error) {
                displayResult('systemStatus', {error: error.message}, true);
            }
        }

        // Check database roles
        async function checkDatabaseRoles() {
            try {
                const response = await fetch('/api/test/roles');
                const data = await response.json();
                displayResult('databaseRoles', data);
            } catch (error) {
                displayResult('databaseRoles', {error: error.message}, true);
            }
        }

        // Test registration
        document.getElementById('registrationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                username: document.getElementById('regUsername').value,
                email: document.getElementById('regEmail').value,
                fullName: document.getElementById('regFullName').value,
                phone: document.getElementById('regPhone').value,
                password: document.getElementById('regPassword').value,
                role: document.getElementById('regRole').value
            };

            try {
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                displayResult('registrationResult', data, !response.ok);
            } catch (error) {
                displayResult('registrationResult', {error: error.message}, true);
            }
        });

        // Test login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                username: document.getElementById('loginUsername').value,
                password: document.getElementById('loginPassword').value
            };

            try {
                const response = await fetch('/api/auth/signin', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Store token
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify({
                        id: data.id,
                        username: data.username,
                        email: data.email,
                        fullName: data.fullName,
                        roles: data.roles
                    }));
                    checkAuthStatus();
                }
                
                displayResult('loginResult', data, !response.ok);
            } catch (error) {
                displayResult('loginResult', {error: error.message}, true);
            }
        });

        // Check authentication status
        async function checkAuthStatus() {
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');
            
            if (!token) {
                displayResult('authStatus', {status: 'Not authenticated'});
                return;
            }

            try {
                const response = await fetch('/api/auth/me', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    displayResult('authStatus', {
                        status: 'Authenticated',
                        user: data,
                        storedUser: JSON.parse(user || '{}')
                    });
                } else {
                    displayResult('authStatus', {status: 'Token invalid or expired'}, true);
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                }
            } catch (error) {
                displayResult('authStatus', {error: error.message}, true);
            }
        }

        // Logout
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            displayResult('authStatus', {status: 'Logged out'});
        }

        // Initialize page
        window.onload = function() {
            checkSystemStatus();
            checkDatabaseRoles();
            checkAuthStatus();
        };
    </script>
</body>
</html>
