<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Images</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .image-generator { margin: 20px 0; }
        canvas { border: 1px solid #ddd; margin: 10px 0; }
        .download-btn { background: #007bff; color: white; padding: 10px 20px; border: none; cursor: pointer; margin: 5px; }
    </style>
</head>
<body>
    <h1>Image Generator for School Health Management System</h1>
    
    <div class="image-generator">
        <h3>Hero Image (1200x800)</h3>
        <canvas id="heroCanvas" width="1200" height="800"></canvas>
        <button class="download-btn" onclick="downloadImage('heroCanvas', 'hero-image.png')">Download Hero Image</button>
    </div>
    
    <div class="image-generator">
        <h3>Login Image (800x600)</h3>
        <canvas id="loginCanvas" width="800" height="600"></canvas>
        <button class="download-btn" onclick="downloadImage('loginCanvas', 'login-image.jpg')">Download Login Image</button>
    </div>
    
    <div class="image-generator">
        <h3>Register Image (800x600)</h3>
        <canvas id="registerCanvas" width="800" height="600"></canvas>
        <button class="download-btn" onclick="downloadImage('registerCanvas', 'register-image.jpg')">Download Register Image</button>
    </div>
    
    <div class="image-generator">
        <h3>Avatar Placeholder (200x200)</h3>
        <canvas id="avatarCanvas" width="200" height="200"></canvas>
        <button class="download-btn" onclick="downloadImage('avatarCanvas', 'avatar-placeholder.jpg')">Download Avatar</button>
    </div>
    
    <div class="image-generator">
        <h3>Student Avatar 1 (200x200)</h3>
        <canvas id="student1Canvas" width="200" height="200"></canvas>
        <button class="download-btn" onclick="downloadImage('student1Canvas', 'student-avatar-1.jpg')">Download Student 1</button>
    </div>
    
    <div class="image-generator">
        <h3>Student Avatar 2 (200x200)</h3>
        <canvas id="student2Canvas" width="200" height="200"></canvas>
        <button class="download-btn" onclick="downloadImage('student2Canvas', 'student-avatar-2.jpg')">Download Student 2</button>
    </div>

    <script>
        // Create gradient background
        function createGradient(ctx, width, height, colors) {
            const gradient = ctx.createLinearGradient(0, 0, width, height);
            colors.forEach((color, index) => {
                gradient.addColorStop(index / (colors.length - 1), color);
            });
            return gradient;
        }

        // Draw medical cross
        function drawMedicalCross(ctx, x, y, size, color) {
            ctx.fillStyle = color;
            // Vertical bar
            ctx.fillRect(x - size/6, y - size/2, size/3, size);
            // Horizontal bar
            ctx.fillRect(x - size/2, y - size/6, size, size/3);
        }

        // Draw stethoscope
        function drawStethoscope(ctx, x, y, size, color) {
            ctx.strokeStyle = color;
            ctx.lineWidth = size/15;
            ctx.beginPath();
            ctx.arc(x - size/3, y - size/3, size/8, 0, Math.PI * 2);
            ctx.arc(x + size/3, y - size/3, size/8, 0, Math.PI * 2);
            ctx.moveTo(x - size/3, y - size/5);
            ctx.quadraticCurveTo(x, y + size/4, x + size/3, y - size/5);
            ctx.moveTo(x - size/6, y + size/4);
            ctx.lineTo(x + size/6, y + size/4);
            ctx.arc(x, y + size/2, size/6, 0, Math.PI * 2);
            ctx.stroke();
        }

        // Hero Image
        function createHeroImage() {
            const canvas = document.getElementById('heroCanvas');
            const ctx = canvas.getContext('2d');
            
            // Background gradient
            const gradient = createGradient(ctx, 1200, 800, ['#4facfe', '#00f2fe', '#43e97b']);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 1200, 800);
            
            // Title
            ctx.fillStyle = 'white';
            ctx.font = 'bold 60px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('School Health', 600, 300);
            ctx.fillText('Management System', 600, 380);
            
            // Subtitle
            ctx.font = '24px Arial';
            ctx.fillText('Comprehensive Student Health Care Solution', 600, 450);
            
            // Medical symbols
            drawMedicalCross(ctx, 200, 200, 80, 'rgba(255,255,255,0.3)');
            drawMedicalCross(ctx, 1000, 600, 80, 'rgba(255,255,255,0.3)');
            drawStethoscope(ctx, 300, 600, 120, 'rgba(255,255,255,0.3)');
            drawStethoscope(ctx, 900, 200, 120, 'rgba(255,255,255,0.3)');
        }

        // Login Image
        function createLoginImage() {
            const canvas = document.getElementById('loginCanvas');
            const ctx = canvas.getContext('2d');
            
            // Background gradient
            const gradient = createGradient(ctx, 800, 600, ['#667eea', '#764ba2']);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 800, 600);
            
            // Login illustration
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.fillRect(250, 150, 300, 300);
            
            // Medical cross
            drawMedicalCross(ctx, 400, 200, 60, '#4facfe');
            
            // Lock symbol
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.rect(350, 280, 100, 80);
            ctx.arc(400, 270, 30, Math.PI, 0, false);
            ctx.stroke();
            
            // Title
            ctx.fillStyle = 'white';
            ctx.font = 'bold 36px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Secure Access', 400, 500);
        }

        // Register Image
        function createRegisterImage() {
            const canvas = document.getElementById('registerCanvas');
            const ctx = canvas.getContext('2d');
            
            // Background gradient
            const gradient = createGradient(ctx, 800, 600, ['#43e97b', '#38f9d7']);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 800, 600);
            
            // Registration illustration
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.fillRect(200, 100, 400, 400);
            
            // Medical symbols
            drawMedicalCross(ctx, 300, 200, 40, '#43e97b');
            drawMedicalCross(ctx, 500, 200, 40, '#43e97b');
            
            // User icon
            ctx.fillStyle = '#38f9d7';
            ctx.beginPath();
            ctx.arc(400, 300, 40, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(360, 340, 80, 80);
            
            // Title
            ctx.fillStyle = 'white';
            ctx.font = 'bold 32px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Join Our System', 400, 550);
        }

        // Avatar Placeholder
        function createAvatarPlaceholder() {
            const canvas = document.getElementById('avatarCanvas');
            const ctx = canvas.getContext('2d');
            
            // Background
            const gradient = createGradient(ctx, 200, 200, ['#f0f0f0', '#e0e0e0']);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 200, 200);
            
            // User silhouette
            ctx.fillStyle = '#ccc';
            ctx.beginPath();
            ctx.arc(100, 70, 30, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(60, 100, 80, 100);
        }

        // Student Avatar 1
        function createStudentAvatar1() {
            const canvas = document.getElementById('student1Canvas');
            const ctx = canvas.getContext('2d');
            
            // Background
            const gradient = createGradient(ctx, 200, 200, ['#ff9a9e', '#fecfef']);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 200, 200);
            
            // Student representation
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(100, 70, 35, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(55, 105, 90, 95);
            
            // Eyes
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(90, 65, 3, 0, Math.PI * 2);
            ctx.arc(110, 65, 3, 0, Math.PI * 2);
            ctx.fill();
            
            // Smile
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(100, 75, 10, 0, Math.PI);
            ctx.stroke();
        }

        // Student Avatar 2
        function createStudentAvatar2() {
            const canvas = document.getElementById('student2Canvas');
            const ctx = canvas.getContext('2d');
            
            // Background
            const gradient = createGradient(ctx, 200, 200, ['#a8edea', '#fed6e3']);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 200, 200);
            
            // Student representation
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(100, 70, 35, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(55, 105, 90, 95);
            
            // Eyes
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(90, 65, 3, 0, Math.PI * 2);
            ctx.arc(110, 65, 3, 0, Math.PI * 2);
            ctx.fill();
            
            // Smile
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(100, 75, 10, 0, Math.PI);
            ctx.stroke();
        }

        // Download function
        function downloadImage(canvasId, filename) {
            const canvas = document.getElementById(canvasId);
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL();
            link.click();
        }

        // Generate all images on load
        window.onload = function() {
            createHeroImage();
            createLoginImage();
            createRegisterImage();
            createAvatarPlaceholder();
            createStudentAvatar1();
            createStudentAvatar2();
        };
    </script>
</body>
</html>
