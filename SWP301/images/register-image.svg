<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="registerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#registerGradient)"/>
  
  <!-- Main illustration container -->
  <rect x="150" y="80" width="500" height="440" fill="rgba(255,255,255,0.95)" rx="25"/>
  
  <!-- Medical symbols -->
  <g fill="#43e97b">
    <!-- Left cross -->
    <rect x="220" y="140" width="15" height="60" />
    <rect x="200" y="157" width="55" height="15" />
    
    <!-- Right cross -->
    <rect x="550" y="140" width="15" height="60" />
    <rect x="530" y="157" width="55" height="15" />
  </g>
  
  <!-- User registration illustration -->
  <g>
    <!-- User icon -->
    <circle cx="400" cy="280" r="45" fill="#38f9d7"/>
    <rect x="355" y="325" width="90" height="80" fill="#38f9d7" rx="10"/>
    
    <!-- Add user symbol -->
    <g fill="white">
      <rect x="395" y="260" width="4" height="40" />
      <rect x="378" y="277" width="40" height="4" />
    </g>
  </g>
  
  <!-- Form elements illustration -->
  <g fill="none" stroke="#ddd" stroke-width="2">
    <rect x="200" y="430" width="180" height="25" rx="3"/>
    <rect x="420" y="430" width="180" height="25" rx="3"/>
    <rect x="200" y="470" width="400" height="25" rx="3"/>
  </g>
  
  <!-- Decorative elements -->
  <g fill="rgba(255,255,255,0.4)">
    <circle cx="80" cy="120" r="15"/>
    <circle cx="720" cy="150" r="12"/>
    <circle cx="100" cy="300" r="10"/>
    <circle cx="700" cy="320" r="18"/>
    <circle cx="90" cy="480" r="8"/>
    <circle cx="710" cy="500" r="14"/>
  </g>
  
  <!-- Floating medical icons -->
  <g fill="rgba(255,255,255,0.3)">
    <!-- Stethoscope -->
    <g fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="3">
      <circle cx="120" cy="200" r="8"/>
      <circle cx="140" cy="200" r="8"/>
      <path d="M 120 210 Q 130 230 140 210"/>
      <circle cx="130" cy="240" r="6"/>
    </g>
    
    <!-- Pills -->
    <ellipse cx="670" cy="250" rx="8" ry="15" fill="rgba(255,255,255,0.3)"/>
    <ellipse cx="690" cy="250" rx="8" ry="15" fill="rgba(255,255,255,0.3)"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#43e97b">Join Our System</text>
  <text x="400" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#666">Create Your Health Profile Today</text>
</svg>
