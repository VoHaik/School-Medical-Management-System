<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00f2fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#43e97b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="url(#heroGradient)"/>
  
  <!-- Medical Cross Icons -->
  <g fill="rgba(255,255,255,0.2)">
    <!-- Top left cross -->
    <rect x="160" y="120" width="20" height="80" />
    <rect x="130" y="150" width="80" height="20" />
    
    <!-- Bottom right cross -->
    <rect x="980" y="620" width="20" height="80" />
    <rect x="950" y="650" width="80" height="20" />
  </g>
  
  <!-- Stethoscope Icons -->
  <g fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="8">
    <!-- Left stethoscope -->
    <circle cx="280" cy="580" r="20"/>
    <circle cx="320" cy="580" r="20"/>
    <path d="M 280 600 Q 300 640 320 600"/>
    <line x1="290" y1="640" x2="310" y2="640"/>
    <circle cx="300" cy="660" r="15"/>
    
    <!-- Right stethoscope -->
    <circle cx="880" cy="180" r="20"/>
    <circle cx="920" cy="180" r="20"/>
    <path d="M 880 200 Q 900 240 920 200"/>
    <line x1="890" y1="240" x2="910" y2="240"/>
    <circle cx="900" cy="260" r="15"/>
  </g>
  
  <!-- Main Content -->
  <g fill="white" text-anchor="middle" font-family="Arial, sans-serif">
    <!-- Title -->
    <text x="600" y="320" font-size="64" font-weight="bold">School Health</text>
    <text x="600" y="400" font-size="64" font-weight="bold">Management System</text>
    
    <!-- Subtitle -->
    <text x="600" y="480" font-size="28">Comprehensive Student Health Care Solution</text>
    
    <!-- Features -->
    <text x="600" y="550" font-size="20" opacity="0.9">✓ Health Records  ✓ Medications  ✓ Appointments  ✓ Reports</text>
  </g>
  
  <!-- Decorative elements -->
  <g fill="rgba(255,255,255,0.1)">
    <circle cx="100" cy="400" r="40"/>
    <circle cx="1100" cy="400" r="40"/>
    <circle cx="600" cy="100" r="30"/>
    <circle cx="600" cy="700" r="30"/>
  </g>
</svg>
