<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="student2Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8edea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fed6e3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="url(#student2Gradient)" rx="100"/>
  
  <!-- Student illustration -->
  <g>
    <!-- Head -->
    <circle cx="100" cy="70" r="40" fill="#fff"/>
    
    <!-- Hair -->
    <path d="M 60 50 Q 70 35 100 35 Q 130 35 140 50 Q 140 70 100 65 Q 60 70 60 50" fill="#2e2e2e"/>
    
    <!-- Face features -->
    <!-- Eyes -->
    <circle cx="88" cy="65" r="3" fill="#333"/>
    <circle cx="112" cy="65" r="3" fill="#333"/>
    
    <!-- Nose -->
    <ellipse cx="100" cy="75" rx="2" ry="3" fill="#ffb3ba"/>
    
    <!-- Smile -->
    <path d="M 90 82 Q 100 90 110 82" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Body -->
    <rect x="60" y="110" width="80" height="90" fill="#fff" rx="10"/>
    
    <!-- School uniform details -->
    <rect x="70" y="120" width="60" height="70" fill="#32cd32" rx="5"/>
    <rect x="85" y="130" width="30" height="40" fill="#fff" rx="3"/>
    
    <!-- Collar -->
    <polygon points="85,120 95,130 105,130 115,120" fill="#fff"/>
  </g>
  
  <!-- Decorative elements -->
  <g fill="rgba(255,255,255,0.3)">
    <circle cx="35" cy="35" r="6"/>
    <circle cx="165" cy="45" r="8"/>
    <circle cx="20" cy="150" r="9"/>
    <circle cx="180" cy="155" r="7"/>
    <circle cx="30" cy="180" r="5"/>
  </g>
</svg>
