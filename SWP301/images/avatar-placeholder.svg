<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="avatarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="url(#avatarGradient)" rx="100"/>
  
  <!-- User silhouette -->
  <g fill="#adb5bd">
    <!-- Head -->
    <circle cx="100" cy="70" r="35"/>
    <!-- Body -->
    <path d="M 50 140 Q 50 120 70 120 L 130 120 Q 150 120 150 140 L 150 200 L 50 200 Z"/>
  </g>
  
  <!-- Medical cross overlay -->
  <g fill="rgba(108, 117, 125, 0.3)">
    <rect x="95" y="25" width="4" height="20" />
    <rect x="87" y="31" width="20" height="4" />
  </g>
</svg>
