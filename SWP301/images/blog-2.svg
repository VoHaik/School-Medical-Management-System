<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blog2Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#blog2Gradient)"/>
  
  <!-- Vaccination illustration -->
  <g fill="rgba(255,255,255,0.9)">
    <!-- Syringe -->
    <rect x="150" y="80" width="100" height="15" fill="white" rx="7"/>
    <rect x="240" y="75" width="30" height="25" fill="white" rx="5"/>
    <polygon points="150,87 130,92 130,82" fill="white"/>
    
    <!-- Medicine bottle -->
    <rect x="180" y="130" width="40" height="60" fill="white" rx="5"/>
    <rect x="185" y="125" width="30" height="10" fill="white" rx="5"/>
    <rect x="190" y="140" width="20" height="8" fill="#43e97b" rx="2"/>
    <text x="200" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">RX</text>
  </g>
  
  <!-- Title overlay -->
  <rect x="0" y="220" width="400" height="80" fill="rgba(0,0,0,0.7)"/>
  <text x="200" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">Vaccination</text>
  <text x="200" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ccc">Important Immunizations</text>
</svg>
