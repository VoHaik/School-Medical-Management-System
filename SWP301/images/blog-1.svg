<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blog1Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#blog1Gradient)"/>
  
  <!-- Medical illustration -->
  <g fill="rgba(255,255,255,0.9)">
    <!-- Stethoscope -->
    <g fill="none" stroke="white" stroke-width="6">
      <circle cx="150" cy="120" r="20"/>
      <circle cx="190" cy="120" r="20"/>
      <path d="M 150 140 Q 170 180 190 140"/>
      <line x1="160" y1="180" x2="180" y2="180"/>
      <circle cx="170" cy="200" r="15"/>
    </g>
    
    <!-- Medical cross -->
    <rect x="240" y="100" width="15" height="60" />
    <rect x="220" y="118" width="55" height="15" />
  </g>
  
  <!-- Title overlay -->
  <rect x="0" y="220" width="400" height="80" fill="rgba(0,0,0,0.7)"/>
  <text x="200" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">Health Tips</text>
  <text x="200" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ccc">Stay Healthy at School</text>
</svg>
