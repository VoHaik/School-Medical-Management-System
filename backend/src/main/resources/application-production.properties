# PRODUCTION CONFIGURATION - School Medical Management System
# ===============================================================

# Database Configuration for Production
# NOTE: Update these values with actual production database credentials
spring.datasource.url=jdbc:sqlserver://[PRODUCTION_DB_HOST]:1433;databaseName=HealthSchoolDB_PROD;encrypt=true;trustServerCertificate=false;characterEncoding=UTF-8;useUnicode=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA Configuration for Production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.properties.hibernate.connection.CharSet=utf8mb4

# JWT Configuration - CRITICAL: Change this secret key for production!
# Generate a strong 512-bit secret using: openssl rand -base64 64
schoolhealth.app.jwtSecret=${JWT_SECRET:CHANGE_THIS_IN_PRODUCTION_512_BIT_SECRET}
schoolhealth.app.jwtExpirationMs=${JWT_EXPIRATION:86400000}

# Server Configuration
server.port=${SERVER_PORT:8080}

# Static Resource Configuration - Production optimized
spring.mvc.static-path-pattern=/static/**,/css/**,/js/**,/images/**,/*.html,/favicon.ico,/logo192.png
spring.web.resources.add-mappings=true
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
spring.mvc.servlet.path=/

# Production Logging Configuration - Reduced verbosity
logging.level.root=WARN
logging.level.com.swp391_8.schoolhealth=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=WARN
logging.level.org.springframework.web.servlet.handler=WARN

# Enable access logs for monitoring
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=%t %a "%r" %s (%D ms)
server.tomcat.accesslog.directory=logs

# Jackson JSON Configuration
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.write_dates_as_timestamps=false

# UTF-8 Encoding Support
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.properties.hibernate.connection.CharSet=utf8mb4
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Security Configuration for Production
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Connection Pool Configuration for Production
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.pool-name=HealthSchoolCP
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000

# Management endpoints (for monitoring) - Secure these appropriately
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoint.info.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# CORS Configuration for Production - Restrict to actual frontend domains
# Update these URLs with your actual production frontend URLs
spring.web.cors.allowed-origins=${ALLOWED_ORIGINS:https://your-frontend-domain.com}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600
