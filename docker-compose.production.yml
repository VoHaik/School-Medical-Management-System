version: '3.8'

services:
  # SQL Server Database
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: school-health-db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrongPassword123!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - school-health-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P YourStrongPassword123! -Q 'SELECT 1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # School Health API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school-health-api
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - DB_USERNAME=sa
      - DB_PASSWORD=YourStrongPassword123!
      - JWT_SECRET=YourGeneratedJWTSecretHere512BitMinimum
      - ALLOWED_ORIGINS=http://localhost:3000,https://your-frontend-domain.com
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - school-health-network
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Frontend (Optional - if you want to serve frontend from Docker)
  frontend:
    image: nginx:alpine
    container_name: school-health-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/build:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - school-health-network
    restart: unless-stopped

volumes:
  sql_data:
    driver: local

networks:
  school-health-network:
    driver: bridge
